#cloud-config
timezone: Europe/Berlin

package_upgrade: true

hostname: humboldt
fqdn: humboldt.tim.jendrian.de
create_hostname_file: true

packages:
  - build-essential
  - libssl-dev
  - zlib1g-dev
  - libbz2-dev
  - libreadline-dev
  - libsqlite3-dev
  - libffi-dev
  - liblzma-dev
  - tk-dev
  - uuid-dev
  - xz-utils
  - fail2ban
  - ufw
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

users:
  - name: kai
    groups: users, wheel, docker
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_import_id:
      - gh:kaijen
  - name: tim
    groups: users, wheel, docker
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXOTDsMRjwRmBtERuUg5nxdl7pfngAwWqR3r1shpfvr
      - ssh-rsa 
      - ssh-rsa  benedikt@benedikt-fw
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFwfCCMix8lC0Cha1tbr7fPt9bRiwwSG30DUsuzb9nyr tim@humboldt.tim.jendrian.de
  - name: ansible
    groups: users, wheel, docker
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOTH7wfLQu4O0RBAukHj4XKCRw9xsi9RKitieEZuADwT ansible@lynx

runcmd:
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin docker-buildx-plugin
  - systemctl enable docker
  - systemctl start docker
  - su - kai -c "curl https://pyenv.run | bash"
  - su - kai -c "echo 'export PATH=\"\$HOME/.pyenv/bin:\$PATH\"' >> ~/.bashrc"
  - su - kai -c "echo 'eval \"\$(pyenv init --path)\"' >> ~/.bashrc"
  - su - kai -c "echo 'eval \"\$(pyenv init -)\"' >> ~/.bashrc"
  - su - kai -c "echo 'eval \"\$(pyenv virtualenv-init -)\"' >> ~/.bashrc"
  - su - kai -c "bash -c 'source ~/.bashrc && ~/.pyenv/bin/pyenv install 3.13'"
  - su - kai -c "bash -c 'source ~/.bashrc && ~/.pyenv/bin/pyenv global 3.13'"
  - su - tim -c "curl https://pyenv.run | bash"
  - su - tim -c "echo 'export PATH=\"\$HOME/.pyenv/bin:\$PATH\"' >> ~/.bashrc"
  - su - tim -c "echo 'eval \"\$(pyenv init --path)\"' >> ~/.bashrc"
  - su - tim -c "echo 'eval \"\$(pyenv init -)\"' >> ~/.bashrc"
  - su - tim -c "echo 'eval \"\$(pyenv virtualenv-init -)\"' >> ~/.bashrc"
  - su - tim -c "bash -c 'source ~/.bashrc && ~/.pyenv/bin/pyenv install 3.13'"
  - su - tim -c "bash -c 'source ~/.bashrc && ~/.pyenv/bin/pyenv global 3.13'"
  - su - ansible -c "curl https://pyenv.run | bash"
  - su - ansible -c "echo 'export PATH=\"\$HOME/.pyenv/bin:\$PATH\"' >> ~/.bashrc"
  - su - ansible -c "echo 'eval \"\$(pyenv init --path)\"' >> ~/.bashrc"
  - su - ansible -c "echo 'eval \"\$(pyenv init -)\"' >> ~/.bashrc"
  - su - ansible -c "echo 'eval \"\$(pyenv virtualenv-init -)\"' >> ~/.bashrc"
  - su - ansible -c "bash -c 'source ~/.bashrc && ~/.pyenv/bin/pyenv install 3.13'"
  - su - ansible -c "bash -c 'source ~/.bashrc && ~/.pyenv/bin/pyenv global 3.13'"
  - su - ansible -c "bash -c 'pip install --upgrade pip'"
  - su - ansible -c "bash -c 'pip install ansible'"


final_message: "The system is finally up, after $UPTIME seconds"